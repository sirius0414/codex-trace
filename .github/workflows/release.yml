name: Release

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: ['main']
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONPATH: backend
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Preserve source bytes for cross-platform distribution checks
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install pinned uv for community marketplace smoke
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.9.27'
          enable-cache: false
      - name: Install locked build and test dependencies
        run: |
          npm ci
          python -m pip install -r requirements.lock
      - name: Check generated contracts
        run: |
          python contracts/generate_types.py --check
      - name: Test backend, packaging and isolated install lifecycle
        shell: python
        run: |
          import subprocess, sys
          command = [sys.executable, '-m', 'unittest', 'discover', '-s', 'tests', '-p', 'test_*.py']
          if sys.platform == 'win32':
              command = [sys.executable, 'scripts/diagnose_windows_permissions.py', '--normalize-test-owner',
                         '--report', 'build/windows-owner-tests.json', '--', *command]
          subprocess.run(command, check=True)
      - name: Test frontend
        run: npm test
      - name: Check committed community marketplace distribution
        run: python scripts/build_community_marketplace.py --check
      - name: Build portable release twice
        run: |
          python scripts/build_release.py --output build/releases
          python scripts/build_release.py --output build/reproduce
      - name: Verify reproducibility and tag version
        shell: python
        run: |
          import hashlib, json, os
          from pathlib import Path
          version = json.loads(Path('package.json').read_text())['version']
          name = f'codex-trace-{version}.zip'
          first = Path('build/releases', name).read_bytes()
          assert first == Path('build/reproduce', name).read_bytes(), 'Release build is not reproducible'
          assert Path('build/releases/SHA256SUMS').read_text() == f'{hashlib.sha256(first).hexdigest()}  {name}\n'
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == f'v{version}', 'Tag must match every package version'
      - name: Check Windows PowerShell 5.1 launcher fallback
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $Runtime = Join-Path $env:pythonLocation 'python.exe'
          function python3.14 { & $Runtime -c "raise ImportError('synthetic unsupported interpreter')" }
          function python3 { & $Runtime @args }
          & .\install.ps1 status --root (Join-Path $env:RUNNER_TEMP 'launcher check')
          if ($LASTEXITCODE -ne 0) { throw 'Launcher did not fall back after an unsupported Python probe' }
      - name: Install pinned native Codex CLI for release smoke
        run: npm install -g @openai/codex@0.153.0
      - name: Smoke test Git community marketplace install and upgrade
        shell: python
        run: |
          import subprocess, sys
          command = [sys.executable, 'scripts/smoke_community_marketplace.py', '--repository', '.',
                     '--report', 'build/community-smoke.json']
          if sys.platform == 'win32':
              command = [sys.executable, 'scripts/diagnose_windows_permissions.py', '--normalize-test-owner',
                         '--report', 'build/windows-owner-community.json', '--', *command]
          subprocess.run(command, check=True)
      - name: Smoke test extracted release with a clean runtime and Codex profile
        shell: python
        run: |
          import json, subprocess, sys
          from pathlib import Path
          version = json.loads(Path('package.json').read_text())['version']
          command = [sys.executable, 'scripts/smoke_release.py',
                     '--archive', f'build/releases/codex-trace-{version}.zip',
                     '--report', 'build/release-smoke.json']
          if sys.platform == 'win32':
              command = [sys.executable, 'scripts/diagnose_windows_permissions.py', '--normalize-test-owner',
                         '--report', 'build/windows-owner-installer.json', '--', *command]
          subprocess.run(command, check=True)
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: windows-owner-diagnostics
          path: build/windows-owner-*.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-smoke-${{ matrix.os }}
          path: build/release-smoke.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: community-smoke-${{ matrix.os }}
          path: build/community-smoke.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            build/releases/*.zip
            build/releases/SHA256SUMS
          if-no-files-found: error

  draft-release:
    # A tag creates a DRAFT only after native macOS and Windows installer and
    # Git community marketplace validation passes. No official-directory gate.
    # Manual runs and PRs only build artifacts; publishing the draft is a human step.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-macos-15
          path: release
      - name: Create or update draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > existing-release.json; then
            python -c 'import json; assert json.load(open("existing-release.json"))["isDraft"], "Refusing to replace assets on a published release"'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Codex Trace $RELEASE_TAG" --notes "Portable installer for macOS and Windows. Download the ZIP and SHA256SUMS, verify the checksum, extract, and follow INSTALL.md. Public plugin-directory listing is a separate submission and is not performed by this workflow."
          fi
          gh release upload "$RELEASE_TAG" release/*.zip release/SHA256SUMS --clobber
